name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to pubspec.yaml)"
        required: false
        type: string
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # A manual run or a pushed tag always releases. A push to master
          # releases only when pubspec.yaml names a version that has no release
          # yet -- i.e. the version was just bumped.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.ref_type }}" == "tag" ]]; then
            RELEASE=true
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE=false
            echo "::notice::$TAG already released; nothing to do."
          else
            RELEASE=true
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build Windows app
        env:
          # Some plugins (local_auth_windows, permission_handler_windows,
          # flutter_local_notifications_windows) still use the deprecated
          # <experimental/coroutine> header, which newer MSVC toolchains on
          # windows-latest turn into a hard error (C2338). Silence it.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Build installer
        shell: pwsh
        run: |
          iscc "/DMyAppVersion=${{ needs.version.outputs.version }}" windows/installer/daily_you.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-windows-installer
          path: build/windows/installer/*.exe

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "build/windows/x64/runner/Release/DailyYou-${{ needs.version.outputs.version }}-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-windows-x64-portable
          path: build/windows/x64/runner/Release/*.zip

  build-linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - run: flutter pub get

      - run: flutter build linux --release

      - name: Install appimage-builder
        run: |
          sudo apt-get install -y python3-pip python3-setuptools patchelf desktop-file-utils libgdk-pixbuf2.0-dev fakeroot strace
          sudo pip3 install appimage-builder

      - name: Build AppImage
        run: appimage-builder --recipe AppImageBuilder.yml --skip-test

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-linux-x86_64-AppImage
          path: "*.AppImage"

  release:
    needs: [version, build-windows, build-linux]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Create the release (tagging HEAD if the tag does not exist yet).
          # If it already exists -- a re-run, or a race -- just (re)upload assets.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/*/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              artifacts/*/*
          fi
