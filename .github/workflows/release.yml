name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to pubspec.yaml)"
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build Windows app
        env:
          # Some plugins (local_auth_windows, permission_handler_windows,
          # flutter_local_notifications_windows) still use the deprecated
          # <experimental/coroutine> header, which newer MSVC toolchains on
          # windows-latest turn into a hard error (C2338). Silence it.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Build installer
        shell: pwsh
        run: |
          iscc "/DMyAppVersion=${{ needs.version.outputs.version }}" windows/installer/daily_you.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-windows-installer
          path: build/windows/installer/*.exe

      - name: Zip portable build
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          zip -r "DailyYou-${{ needs.version.outputs.version }}-windows-x64-portable.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-windows-x64-portable
          path: build/windows/x64/runner/Release/*.zip

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - run: flutter pub get

      - run: flutter build linux --release

      - name: Install appimage-builder
        run: |
          sudo apt-get install -y python3-pip python3-setuptools patchelf desktop-file-utils libgdk-pixbuf2.0-dev fakeroot strace
          sudo pip3 install appimage-builder

      - name: Build AppImage
        run: appimage-builder --recipe AppImageBuilder.yml --skip-test

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-linux-x86_64-AppImage
          path: "*.AppImage"

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build macos --release

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r "DailyYou-${{ needs.version.outputs.version }}-macos.zip" daily_you.app

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-macos
          path: build/macos/Build/Products/Release/DailyYou-${{ needs.version.outputs.version }}-macos.zip

  release:
    needs: [version, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            artifacts/*/*
