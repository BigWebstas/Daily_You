name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to pubspec.yaml)"
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build Windows app
        env:
          # Some plugins (local_auth_windows, permission_handler_windows,
          # flutter_local_notifications_windows) still use the deprecated
          # <experimental/coroutine> header, which newer MSVC toolchains on
          # windows-latest turn into a hard error (C2338). Silence it.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Build installer
        shell: pwsh
        run: |
          iscc "/DMyAppVersion=${{ needs.version.outputs.version }}" windows/installer/daily_you.iss

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-windows-installer
          path: build/windows/installer/*.exe

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "build/windows/x64/runner/Release/DailyYou-${{ needs.version.outputs.version }}-windows-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-windows-x64-portable
          path: build/windows/x64/runner/Release/*.zip

  build-choco:
    needs: [version, build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-windows-installer
          path: windows/choco

      - name: Point package at this release
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $installer = "windows/choco/DailyYou-$version-windows-x64-setup.exe"
          $sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()

          $nuspec = "windows/choco/daily-you.nuspec"
          (Get-Content $nuspec) -replace '<version>[\d.]+</version>', "<version>$version</version>" | Set-Content $nuspec

          $installScript = "windows/choco/tools/chocolateyinstall.ps1"
          (Get-Content $installScript) `
            -replace 'releases/download/v[\d.]+/DailyYou-[\d.]+-windows-x64-setup\.exe', "releases/download/v$version/DailyYou-$version-windows-x64-setup.exe" `
            -replace "checksum64\s*=\s*'.*'", "checksum64     = '$sha256'" |
            Set-Content $installScript

      - name: Build Chocolatey package
        shell: pwsh
        run: choco pack windows/choco/daily-you.nuspec --outputdirectory windows/choco

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-choco
          path: windows/choco/*.nupkg

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - run: flutter pub get

      - run: flutter build linux --release

      - name: Set AppImage version
        run: |
          sed -i "s/^    version: .*/    version: ${{ needs.version.outputs.version }}/" AppImageBuilder.yml

      - name: Install appimage-builder
        run: |
          sudo apt-get install -y python3-pip python3-setuptools patchelf desktop-file-utils libgdk-pixbuf2.0-dev fakeroot strace
          sudo pip3 install appimage-builder

      - name: Build AppImage
        run: appimage-builder --recipe AppImageBuilder.yml --skip-test

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-linux-x86_64-AppImage
          path: "*.AppImage"

      - name: Tar release bundle for Arch packaging
        run: |
          tar -czf "DailyYou-${{ needs.version.outputs.version }}-linux-x86_64-bundle.tar.gz" -C build/linux/x64/release bundle

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-linux-x86_64-bundle
          path: DailyYou-${{ needs.version.outputs.version }}-linux-x86_64-bundle.tar.gz

  build-arch-pkg:
    needs: [version, build-linux]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install makepkg deps
        run: |
          pacman -Syu --noconfirm --needed base-devel gtk3 sqlite

      - uses: actions/download-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-linux-x86_64-bundle
          path: linux/arch

      - name: Build Arch package
        run: |
          cd linux/arch
          cp ../../assets/logo.svg .
          sed -i "s/^pkgver=.*/pkgver=${{ needs.version.outputs.version }}/" PKGBUILD
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg --syncdeps --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-arch-pkg
          path: linux/arch/*.pkg.tar.zst

  build-flatpak:
    # The manifest downloads the Linux bundle from this release's own
    # GitHub Releases URL, so this job has to run after that release
    # (and asset) actually exists, unlike build-arch-pkg: makepkg looks
    # for a same-named local file before fetching a source URL, but
    # flatpak-builder's archive source type has no such local fallback.
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Point manifest at this release
        run: |
          cd flatpak
          VERSION="${{ needs.version.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/DailyYou-$VERSION-linux-x86_64-bundle.tar.gz"
          curl -sL -o bundle.tar.gz "$URL"
          SHA256=$(sha256sum bundle.tar.gz | cut -d' ' -f1)
          rm bundle.tar.gz
          sed -i -E "s#releases/download/v[0-9.]+/DailyYou-[0-9.]+-linux-x86_64-bundle.tar.gz#releases/download/v$VERSION/DailyYou-$VERSION-linux-x86_64-bundle.tar.gz#" io.github.bigwebstas.daily_you.yml
          sed -i "s/sha256: .*/sha256: $SHA256/" io.github.bigwebstas.daily_you.yml

      - name: Build Flatpak bundle
        run: |
          cd flatpak
          flatpak-builder --force-clean --repo=repo build-dir io.github.bigwebstas.daily_you.yml
          flatpak build-bundle repo "DailyYou-${{ needs.version.outputs.version }}-x86_64.flatpak" io.github.bigwebstas.daily_you

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            flatpak/*.flatpak

  build-snap:
    # Same reason as build-flatpak: snapcraft's dump plugin fetches the
    # source URL over the network with no local-file fallback, so this
    # has to run after the release (and its bundle asset) exists.
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point snapcraft.yaml at this release
        run: |
          cd snap
          VERSION="${{ needs.version.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/DailyYou-$VERSION-linux-x86_64-bundle.tar.gz"
          curl -sL -o bundle.tar.gz "$URL"
          SHA256=$(sha256sum bundle.tar.gz | cut -d' ' -f1)
          rm bundle.tar.gz
          sed -i -E "s/^version: '.*'/version: '$VERSION'/" snapcraft.yaml
          sed -i -E "s#source: https://github.com/[^[:space:]]+/releases/download/v[0-9.]+/DailyYou-[0-9.]+-linux-x86_64-bundle.tar.gz#source: $URL#" snapcraft.yaml
          sed -i -E "s#source-checksum: sha256/.*#source-checksum: sha256/$SHA256#" snapcraft.yaml

      - uses: snapcore/action-build@v1
        id: build

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            "${{ steps.build.outputs.snap }}"

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-snap
          path: ${{ steps.build.outputs.snap }}

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build macos --release

      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r "DailyYou-${{ needs.version.outputs.version }}-macos.zip" daily_you.app

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-macos
          path: build/macos/Build/Products/Release/DailyYou-${{ needs.version.outputs.version }}-macos.zip

  release:
    needs: [version, build-windows, build-choco, build-linux, build-arch-pkg, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: DailyYou-*

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --generate-notes \
            artifacts/*/*

  push-choco:
    # A Chocolatey moderation/rate-limit rejection (e.g. a prior version
    # still pending review) is common and out of our control, so this is
    # split from build-choco: it can fail without blocking the GitHub
    # release or the Flatpak/snap jobs that depend on it existing.
    needs: [version, build-choco, release]
    runs-on: windows-latest
    environment: Prod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-choco
          path: windows/choco

      - name: Push to Chocolatey
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          choco apikey --api-key $env:CHOCO_API_KEY --source https://push.chocolatey.org/
          choco push (Get-Item windows/choco/*.nupkg).FullName --source https://push.chocolatey.org/

  push-snap:
    # Same split rationale as push-choco: a Snap Store review delay on a
    # new/unproven package shouldn't block the GitHub release from existing.
    needs: [version, build-snap]
    runs-on: ubuntu-latest
    environment: Prod
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DailyYou-${{ needs.version.outputs.version }}-snap
          path: snap-build

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Push to Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft upload --release=stable snap-build/*.snap
