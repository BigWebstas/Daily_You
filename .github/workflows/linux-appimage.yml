name: Linux AppImage

# Manual, standalone AppImage build. The automatic release path lives in
# release.yml; this is for one-off builds from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Match release.yml: build on the oldest supported Ubuntu for glibc compat.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - run: flutter pub get

      - run: flutter build linux --release

      - name: Install appimage-builder
        run: |
          sudo apt-get install -y python3-pip python3-setuptools patchelf desktop-file-utils libgdk-pixbuf2.0-dev fakeroot strace xvfb dbus-x11
          sudo pip3 install appimage-builder

      - name: Build AppImage
        run: linux/package_appimage.sh "${{ steps.version.outputs.version }}"

      - name: Smoke-test the AppImage
        run: |
          APP="DailyYou-${{ steps.version.outputs.version }}-x86_64.AppImage"
          # Launch headless and expect it to stay running (timeout kills it => 124).
          # A missing library or a plugin crash exits fast with another code.
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 \
            dbus-run-session -- xvfb-run -a timeout 20 "./$APP"
          rc=$?
          set -e
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::$APP failed to launch (exit $rc)"
            exit 1
          fi
          echo "$APP OK (exit $rc)"

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ steps.version.outputs.version }}-linux-x86_64-AppImage
          path: "*.AppImage"
