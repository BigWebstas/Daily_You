name: Windows Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (defaults to pubspec.yaml)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Build Windows app
        env:
          # Some plugins (local_auth_windows, permission_handler_windows,
          # flutter_local_notifications_windows) still use the deprecated
          # <experimental/coroutine> header, which newer MSVC toolchains on
          # windows-latest turn into a hard error (C2338). Silence it.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Zip portable build
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          zip -r "DailyYou-${{ steps.version.outputs.version }}-windows-x64-portable.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: DailyYou-${{ steps.version.outputs.version }}-windows-x64-portable
          path: build/windows/x64/runner/Release/*.zip

      - name: Attach portable build to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/windows/x64/runner/Release/*.zip --clobber
